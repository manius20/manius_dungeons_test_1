name: manius_dungeons - buduj JAR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build (Maven)
        run: mvn -B --no-transfer-progress clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: manius_dungeons-JAR
          path: target/manius_dungeons-*.jar
          if-no-files-found: error
